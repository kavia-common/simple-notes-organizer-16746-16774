<header class="toolbar">
  <div class="brand">
    <span class="logo">📝</span>
    <span class="title">Simple Notes</span>
  </div>

  <div class="search">
    <input
      type="text"
      [value]="searchQuery"
      (input)="onSearch($any($event.target)?.value || '')"
      placeholder="Search notes..."
      aria-label="Search notes"
    />
  </div>

  <div class="actions">
    <button type="button" class="btn btn-primary" (click)="create.emit()" title="New note">New</button>
    <button type="button" class="btn btn-accent" (click)="save.emit()" title="Save note">Save</button>
    <button type="button" class="btn btn-danger" (click)="delete.emit()" title="Delete note">Delete</button>
  </div>
</header>
